version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/infrastructure/queries/"
    schema: "internal/infrastructure/migrations/"
    gen:
      go:
        package: "db"
        out: "internal/infrastructure/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "numeric"
            go_type: "float64"
